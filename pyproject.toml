[project]
name = "vroomvalue"
version = "0.1.0"
description = "Used-car price prediction MVP with calibrated uncertainty and explanations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "catboost>=1.2.8,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "shap>=0.47,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "mlflow>=3.0,<4",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "model: model-quality tests that require a trained artifact",
  "integration: API + persistence integration tests",
  "e2e: browser-level tests",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "apps.api*"]