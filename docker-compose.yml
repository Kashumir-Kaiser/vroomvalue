services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vroomvalue
      POSTGRES_USER: vroomvalue
      POSTGRES_PASSWORD: vroomvalue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vroomvalue -d vroomvalue"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - vroomvalue_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+psycopg://vroomvalue:vroomvalue@db:5432/vroomvalue
      DATASET_PATH: data/automobile_dataset.csv
      MODEL_ARTIFACT_PATH: models/auto_price.joblib
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - __pycache__/
        - action: sync
          path: ./ml
          target: /app/ml
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./pyproject.toml
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  vroomvalue_pg:
