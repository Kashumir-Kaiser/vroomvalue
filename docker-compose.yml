services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vroomvalue
      POSTGRES_USER: vroomvalue
      POSTGRES_PASSWORD: vroomvalue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vroomvalue -d vroomvalue"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - vroomvalue_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    command:
      - uvicorn
      - apps.api.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/apps/api
      - --reload-dir
      - /app/ml
      - --no-access-log
    environment:
      DATABASE_URL: postgresql+psycopg://vroomvalue:vroomvalue@db:5432/vroomvalue
      DATASET_PATH: data/automobile_dataset.csv
      MODEL_ARTIFACT_PATH: models/auto_price.joblib
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./apps/api:/app/apps/api
      - ./ml:/app/ml
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./infra/docker/api.Dockerfile
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web:/app
      - vroomvalue_web_node_modules:/app/node_modules
      - vroomvalue_web_next:/app/.next
    develop:
      watch:
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json
        - action: rebuild
          path: ./infra/docker/web.Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  vroomvalue_pg:
  vroomvalue_web_node_modules:
  vroomvalue_web_next:
